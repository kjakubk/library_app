{% extends 'library/base.html' %}

{% block title %}Dodaj nowy winyl{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Dodaj nową płytę do kolekcji</h4>
            </div>
            <div class="card-body">
                <!-- Atrybut enctype jest ABSOLUTNIE WYMAGANY przy wgrywaniu plików -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-info text-white">Zapisz płytę</button>
                        <a href="{% url 'vinyl_list' %}" class="btn btn-outline-secondary">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
