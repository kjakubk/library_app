{% extends 'library/base.html' %}

{% block title %}Wymagany Kod Dostępu{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-dark">
            <div class="card-body text-center p-5">
                <h3 class="mb-4">Zabezpieczona Kolekcja</h3>
                <p class="text-muted mb-4">Podaj kod dostępu, aby przeglądać moje prywatne zbiory.</p>

                <!-- Wyświetlanie błędu, jeśli wpisano zły kod -->
                {% if error_message %}
                    <div class="alert alert-danger">{{ error_message }}</div>
                {% endif %}

                <!-- Formularz logowania -->
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="password" name="access_code" class="form-control form-control-lg text-center" placeholder="Wpisz kod..." required>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100">Odblokuj dostęp</button>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
