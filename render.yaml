databases:
  - name: library_db
    databaseName: library_db
    user: postgres
    plan: free

services:
  - type: web
    name: library-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: AUTH_WHITELIST
        value: "jakub,admin"
